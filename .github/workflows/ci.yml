name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: FedericoCarboni/setup-ffmpeg@v2
        with:
          ffmpeg-version: release
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest tests/ -q

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - name: Install engine deps
        working-directory: engine
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: engine
        run: npx tsc --noEmit -p .

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: FedericoCarboni/setup-ffmpeg@v2
        with:
          ffmpeg-version: release
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - name: Install engine deps
        working-directory: engine
        run: npm ci --no-audit --no-fund
      - name: Install ARGUS
        run: pip install -e ".[dev]"
      - name: Scenario tests
        run: pytest tests/test_scenarios.py -v -rs --durations=0
