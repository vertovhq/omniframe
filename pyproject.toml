[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-studio"
# single source of truth: src/argus/__init__.py -> __version__
dynamic = ["version"]
description = "ARGUS — MCP server for producing viral vertical videos: Veo 3.1 clips, voiceover with word timings, a Remotion render engine, QA and export."
readme = "README.md"
# SPDX expression per PEP 639: https://peps.python.org/pep-0639/ (no License :: classifier with it)
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "VertovHQ" }]
requires-python = ">=3.11"
keywords = ["mcp", "veo", "gemini", "video", "voiceover", "subtitles", "ffmpeg"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "mcp>=1.2.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.optional-dependencies]
pretty = ["rich>=13.0.0"]
voice = ["edge-tts>=7.0"]
flow = ["playwright>=1.49"]
asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
argus-studio = "argus.server:main"
argus-doctor = "argus.doctor:main"

[tool.hatch.version]
path = "src/argus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

# The render engine travels inside the wheel as argus/_engine; see src/argus/engine_setup.py.
# Hatch is expected to skip git-ignored files here (engine/node_modules, engine/public/sfx).
# Check the wheel's contents before a release; this is not verified yet.
[tool.hatch.build.targets.wheel.force-include]
"engine" = "argus/_engine"

[tool.pytest.ini_options]
testpaths = ["tests"]
