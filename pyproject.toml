[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-studio"
version = "1.0.0"
description = "ARGUS — MCP server for producing viral vertical videos: Veo 3.1 clips, mastered AI voiceover, karaoke subtitles, acoustic timeline and QA."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "ARGUS contributors" }]
requires-python = ">=3.11"
keywords = ["mcp", "veo", "gemini", "video", "voiceover", "subtitles", "ffmpeg"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "mcp>=1.2.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
pretty = ["rich>=13.0.0"]
flow = ["playwright>=1.49"]
dev = ["pytest>=8.0.0"]

[project.scripts]
argus-studio = "argus.server:main"

[project.urls]
Homepage = "https://github.com/your-name/argus-studio"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
